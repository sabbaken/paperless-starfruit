name: API · Publish image

# Builds and pushes the @paperless-starfruit/api Docker image to GitHub Container
# Registry (ghcr.io) when a GitHub release is published. The release tag (e.g.
# v1.2.0) names the version: the image is built from the tagged commit, stamped
# with APP_VERSION, tagged `<version>` (plus `latest` for non-prereleases), and
# the pull command is appended to the release notes. Use the manual trigger to
# rebuild an existing release's image (e.g. after a base-image security fix).
# It never moves `latest` unless explicitly asked to.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (e.g. v1.2.0)
        required: true
        type: string
      latest:
        description: Also point the `latest` tag at this build
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # checkout the tag + append the image reference to the release notes
      packages: write # required to push to ghcr.io with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Derive the version from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a semver version (expected e.g. v1.2.0)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || inputs.latest == true }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: . # repo root: Dockerfile needs the workspace + packages/shared
          file: docker/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Append the image reference to the release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/api:$VERSION"
          body="$(gh release view "$TAG" --json body -q .body)"
          # Idempotent: a re-run must not duplicate the section.
          if ! grep -qF "$image" <<< "$body"; then
            printf '%s\n\n**Docker image:** `%s`\n' "$body" "$image" > body.md
            gh release edit "$TAG" --notes-file body.md
          fi
