name: API · Publish image

# Builds and pushes the @paperless-starfruit/api Docker image to GitHub Container
# Registry (ghcr.io) on every push to master — but ONLY when files that affect
# the image change. docker/Dockerfile builds the whole workspace from the repo
# root and the API serves apps/web/dist (ServeStaticModule), so the paths filter
# must include the web app and packages/shared too; a change to either alone
# would otherwise produce a stale image.
on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'docker/Dockerfile'
      - '.github/workflows/api-publish.yml'
  workflow_dispatch: # allow manual builds from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: . # repo root — Dockerfile needs the workspace + packages/shared
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
