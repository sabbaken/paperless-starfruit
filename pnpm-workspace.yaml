packages:
  - apps/*
  - packages/*

overrides:
  undici: ^7.30.1
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
  '@vitest/mocker@<4.1.12': ^4.1.12
  astro@<7.3.3: ^7.3.3
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  devalue@<5.9.3: ^5.9.3
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  multer@<2.5.0: ^2.5.0
  postcss-selector-parser@<6.1.5: ^6.1.5
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  qs@>=2.2.5 <6.16.1: ^6.16.1
  sharp@<0.35.5: ^0.35.5
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  smol-toml@<=1.8.0: ^1.9.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  svgo@>=4.0.0 <4.1.0: ^4.1.0
  vite@<=6.4.3: ^6.4.4
  vite@>=8.2.0 <=8.2.3: ^8.2.4
  vitest@>=2.1.0 <4.1.11: ^4.1.11
  zod@<4.6.6: ^4.6.6

# pnpm 11 removed `onlyBuiltDependencies`, and pnpm 12 ignores it without a
# warning. It reads this map instead and fails the install on any dependency
# build script that is not in it.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  '@nestjs/core': true
  sharp: true

packageExtensions:
  '@hookform/resolvers':
    peerDependencies:
      zod: '*'
