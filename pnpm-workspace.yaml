packages:
  - apps/*
  - packages/*

overrides:
  undici: ^7.29.0
  '@esbuild-kit/core-utils>esbuild': ^0.25.12

# pnpm 11 removed `onlyBuiltDependencies`, and pnpm 12 ignores it without a
# warning. It reads this map instead and fails the install on any dependency
# build script that is not in it.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  '@nestjs/core': true
  sharp: true

packageExtensions:
  '@hookform/resolvers':
    peerDependencies:
      zod: '*'
